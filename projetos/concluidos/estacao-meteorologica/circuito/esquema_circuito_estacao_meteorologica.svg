yline points="857.0,932 893.0,932" fill="none" stroke="#526477" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="863.5,941 886.5,941" fill="none" stroke="#526477" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="870.0,950 880.0,950" fill="none" stroke="#526477" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="962" y="948" fill="#526477" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start">GND comum = OUT− do TP4056</text><rect x="65" y="970" width="1790" height="63" rx="6" fill="#edf3f7" stroke="#edf3f7" stroke-width="3"/><text x="85" y="997" fill="#526477" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start">Interligação dos módulos da montagem, sem resistores externos. Componentes internos dos módulos não estão detalhados.</text><text x="85" y="1023" fill="#526477" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start">Nós com o mesmo nome são interligados. Pinos por função; conferir posição no módulo. GND do sistema vem da saída protegida OUT−.</text><text x="65" y="1062" fill="#526477" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Base: codigo_meteorologica_v2.ino  •  Sensores conforme firmware; bateria conforme configuração confirmada</text><text x="1855" y="1062" fill="#007f83" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="end">16:9  /  REV. 02</text></svg>
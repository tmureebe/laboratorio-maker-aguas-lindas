="normal" text-anchor="start">B+</text><text x="465" y="399" fill="#526477" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">B−</text><text x="746" y="284" fill="#bd4c38" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="end">OUT+</text><text x="746" y="406" fill="#526477" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="end">OUT−</text><polyline points="760,300 850,300" fill="none" stroke="#bd4c38" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="850,300 902,276" fill="none" stroke="#bd4c38" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="850" cy="300" r="4" fill="#bd4c38"/><circle cx="930" cy="300" r="4" fill="#bd4c38"/><polyline points="930,300 1080,300" fill="none" stroke="#bd4c38" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="895" y="254" fill="#17324d" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="middle">S1</text><text x="915" y="340" fill="#526477" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="middle">Liga / desliga</text><polyline points="760,370 1080,370" fill="none" stroke="#526477" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="920" y="404" fill="#526477" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle">Negativo protegido</text><rect x="1080" y="260" width="315" height="160" rx="0" fill="white" stroke="#17324d" stroke-width="3"/><text x="1237" y="307" fill="#17324d" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle">U3 · STEP-UP</text><text x="1237" y="343" fill="#526477" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="middle">Conversor elevador</text><text x="1237" y="379" fill="#526477" font-family="DejaVu Sans" font-size="21" font-weight="normal" text-anchor="middle">Saída ajustada em 5 V</text><text x="1093"
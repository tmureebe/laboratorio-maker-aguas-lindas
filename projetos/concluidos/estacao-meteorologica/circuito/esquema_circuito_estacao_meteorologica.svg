<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img"><title>Estação meteorológica — esquema elétrico</title><desc>Esquema de interligação por módulos: bateria 18650, TP4056 com proteção, chave, conversor elevador para 5 V, ESP32 clássico, DHT11 e BMP280 em I2C 0x76. Montagem informada sem resistores externos; componentes internos dos módulos não detalhados. Nós com o mesmo nome são conectados. Pinos representados por função, não pela posição física.</desc><rect width="1920" height="1080" fill="white"/><rect x="0" y="0" width="1920" height="14" rx="0" fill="#007f83" stroke="#007f83" stroke-width="3"/><text x="65" y="83" fill="#17324d" font-family="DejaVu Sans" font-size="48" font-weight="bold" text-anchor="start">Estação meteorológica</text><text x="65" y="130" fill="#526477" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start">Esquema elétrico de interligação  •  ESP32 + DHT11 + BMP280  •  Alimentação por bateria</text><rect x="1640" y="50" width="215" height="54" rx="8" fill="#edf3f7" stroke="#edf3f7" stroke-width="3"/><text x="1747" y="85" fill="#007f83" font-family="DejaVu Sans" font-size="20" font-weight="bold" text-anchor="middle">FIRMWARE v2</text><text x="65" y="190" fill="#007f83" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="start">01  ALIMENTAÇÃO E RECARGA</text><polyline points="65,203 1855,203" fill="none" stroke="#edf3f7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="260" width="235" height="160" rx="8" fill="#edf3f7" stroke="#17324d" stroke-width="2.5"/><text x="197" y="300" fill="#17324d" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle">BT1 · 18650</text><text x="197" y="337" fill="#526477" font-family="DejaVu Sans" font-size="22" font-weight="normal" text-anchor="middle">Li-ion · 1 célula</text><text x="197" y="372" fill="#526477" font-family="DejaVu Sans" font-size="22" font-weigh
="18" font-weight="normal" text-anchor="middle">VIN</text><text x="995" y="614" fill="#bd4c38" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="middle">3V3</text><polyline points="995,590 995,490 1790,490" fill="none" stroke="#bd4c38" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1040" y="478" fill="#bd4c38" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="start">+3V3</text><polyline points="875,870 875,920" fill="none" stroke="#526477" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="875" y="861" fill="#526477" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="middle">GND</text><text x="716" y="724" fill="#2869aa" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="start">GPIO4</text><text x="1035" y="680" fill="#2869aa" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="end">GPIO21</text><text x="1035" y="740" fill="#2869aa" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="end">GPIO22</text><rect x="110" y="625" width="240" height="210" rx="0" fill="white" stroke="#17324d" stroke-width="3"/><text x="230" y="673" fill="#17324d" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle">U4 · DHT11</text><text x="230" y="710" fill="#526477" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle">Temperatura</text><text x="230" y="739" fill="#526477" font-family="DejaVu Sans" font-size="20" font-weight="normal" text-anchor="middle">e umidade</text><text x="335" y="655" fill="#bd4c38" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="end">VCC</text><text x="335" y="759" fill="#2869aa" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="end">DATA</text><text x="335" y="820" fill="#526477" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="end">GND</text>
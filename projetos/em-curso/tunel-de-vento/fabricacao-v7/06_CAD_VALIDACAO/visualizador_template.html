<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Túnel híbrido V7 · Modelo 3D</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f4;color:#153f4a;font-family:system-ui,sans-serif}header{padding:22px 28px;background:white;border-bottom:1px solid #d4e1e4}h1{margin:0 0 5px;font-size:24px}p{margin:6px 0;font-size:14px;color:#526b75}.bar{display:flex;gap:18px;flex-wrap:wrap;padding:16px 28px;background:white}label{display:flex;gap:7px;align-items:center;font-size:14px}button{border:1px solid #b5cbd1;background:#eef5f6;border-radius:6px;padding:7px 12px;color:#153f4a;cursor:pointer}canvas{width:100%;height:calc(100vh - 250px);display:block;touch-action:none;min-height:350px}.legend{display:flex;gap:20px;padding:12px 28px;font-size:13px}.dot{display:inline-block;width:13px;height:13px;margin-right:7px;border-radius:3px}#status{padding:5px 28px}</style>
<header><h1>Túnel híbrido · V7</h1><p>Modelo completo com peças identificadas por material. Arraste para girar; use a roda para aproximar.</p></header>
<div class="bar"><label><input id="mdf" type="checkbox" checked>MDF</label><label><input id="printed" type="checkbox" checked>Impressão 3D</label><label><input id="bought" type="checkbox" checked>Comprados</label><label><input id="glass" type="checkbox" checked>Acrílico</label><label><input id="open" type="checkbox">Abrir dutos e janela</label><label><input id="exploded" type="checkbox">Explodir</label><button id="reset">Vista inicial</button></div>
<canvas id="view" aria-label="Modelo 3D interativo"></canvas><div class="legend"><span><i class="dot" style="background:#bf9764"></i>MDF</span><span><i class="dot" style="background:#1d8097"></i>Impresso</span><span><i class="dot" style="background:#64707a"></i>Comprado</span><span><i class="dot" style="background:#9bdfec"></i>Acrílico</span></div><p id="status">As referências de ventoinha e célula são simplificadas. Ferragens não aparecem. Este conjunto é para visualizar.</p>
<script>
const groups=__GROUPS__,encoded="__DATA__",canvas=document.getElementById('view'),gl=canvas.getContext('webgl',{antialias:true});
if(!gl){document.getElementById('status').textContent='WebGL indisponível. Consulte as imagens PNG e o OBJ/STL na mesma pasta.';}else{
const bin=atob(encoded),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`attribute vec3 position;attribute vec3 normal;attribute vec3 color;uniform mat3 view;uniform vec3 shift;uniform float zoom;uniform float aspect;varying vec3 shade;varying vec3 world;void main(){world=position;vec3 p=view*(position+shift);gl_Position=vec4(p.x*zoom,p.y*zoom*aspect,-p.z*.22,1.);float light=.64+.30*max(dot(normal,normalize(vec3(-.35,-.5,1.))),0.);shade=color*light;}`));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 shade;varying vec3 world;uniform float alpha;uniform float cutCam;void main(){if(cutCam>.5&&world.y<-.157333&&world.z>-.08693)discard;gl_FragColor=vec4(shade,alpha);}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(bytes.buffer),gl.STATIC_DRAW);
for(const [name,offset] of [['position',0],['normal',12],['color',24]]){const p=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,3,gl.FLOAT,false,36,offset);}
const uniforms={};for(const name of ['view','shift','zoom','aspect','alpha','cutCam'])uniforms[name]=gl.getUniformLocation(program,name);
let yaw=-2.15,elev=.49,zoom=.88,drag=null;const inputs=[...document.querySelectorAll('input')];
function draw(){const dpi=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*dpi),h=Math.round(canvas.clientHeight*dpi);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clearColor(.94,.965,.97,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
const cy=Math.cos(yaw),sy=Math.sin(yaw),ce=Math.cos(elev),se=Math.sin(elev);gl.uniformMatrix3fv(uniforms.view,false,new Float32Array([-sy,-cy*se,cy*ce,cy,-sy*se,sy*ce,0,ce,se]));gl.uniform1f(uniforms.zoom,zoom);gl.uniform1f(uniforms.aspect,w/h);
const enabled={MDF:document.getElementById('mdf').checked,impresso:document.getElementById('printed').checked,comprado:document.getElementById('bought').checked,acrilico:document.getElementById('glass').checked};const open=document.getElementById('open').checked,exp=document.getElementById('exploded').checked;
function paint(g){if(!enabled[g.material])return;if(open&&(g.group==='duto_teto'||g.group==='duto_frente'||g.group==='janela'))return;gl.uniform1f(uniforms.cutCam,open&&g.group==='camara'?1:0);gl.uniform3fv(uniforms.shift,new Float32Array(exp?g.explode:[0,0,0]));gl.uniform1f(uniforms.alpha,g.material==='acrilico'?.25:1);gl.drawArrays(gl.TRIANGLES,g.start,g.count);}
gl.disable(gl.BLEND);gl.depthMask(true);groups.filter(g=>g.material!=='acrilico').forEach(paint);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);groups.filter(g=>g.material==='acrilico').forEach(paint);gl.depthMask(true);}
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.006;elev=Math.max(-1.3,Math.min(1.3,elev+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];draw();});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.25,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));draw();},{passive:false});inputs.forEach(i=>i.addEventListener('change',()=>{if(i.id==='exploded')zoom=i.checked?.57:.88;draw();}));document.getElementById('reset').onclick=()=>{yaw=-2.15;elev=.49;zoom=.88;inputs.forEach(i=>i.checked=!['open','exploded'].includes(i.id));draw();};window.addEventListener('resize',draw);draw();window.tunelViewer={groups,gl,draw};}
</script></html>
